<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"crossorigin="anonymous"referrerpolicy="no-referrer">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Fetch Student CRUD 1</title>
    <style>
        .spinner {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.80);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

    </style>
</head>

<body>
    <header class="text-center text-white">
        <h1><i class="fa-solid fa-plane-departure"></i>Airline Reservation</h1>
        <p>Explore | Book | Fly | Make Memories</p>
    </header>
    <div class="container-fluid mt-4 px-3 px-lg-4">
        <div class="row">
            <div class="col-lg-12 col-md-5 mb-4">
                <div class="card my-form">
                    <div class="card-header">
                        <h4 class="m-0 text-center"><i class="fa-solid fa-plane"></i>Book Your Flight</h4>
                        <p class="text-center mb-0 mt-1">Fill the details to reserve your ticket</p>
                    </div>
                    <div class="card-body">
                        <form class="form" id="form">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="PassangersName"><i class="fa-solid fa-user"></i> Passenger Name</label>
                                        <input required
                                            type="text"
                                            class="form-control"
                                            id="PassangersName"
                                            placeholder="Enter passenger name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="JourneyType"><i class="fa-solid fa-plane"></i>Journey Type</label>
                                        <select class="form-control"
                                            id="JourneyType"
                                            required>
                                            <option value="">Select Option</option>
                                            <option value="Oneway">Oneway</option>
                                            <option value="Return">Return</option>
                                            <option value="Both Way">Both Way</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="NumberofPassanger"><i class="fa-solid fa-users"></i>Number of Passengers</label>
                                        <input required
                                            type="number"
                                            min="1"
                                            class="form-control"
                                            id="NumberofPassanger"
                                            placeholder="Enter count">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="from"><i class="fa-solid fa-location-dot"></i>From</label>
                                        <select class="form-control"
                                            id="from"
                                            required>
                                            <option value="">Select From City</option>
                                            <option value="Pune">Pune</option>
                                            <option value="Mumbai">Mumbai</option>
                                            <option value="Kolkata">Kolkata</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="To"><i class="fa-solid fa-location-dot"></i>To</label>
                                        <select class="form-control"
                                            id="To"
                                            required>
                                            <option value="">Select To City</option>
                                            <option value="Sweden">Sweden</option>
                                            <option value="Dubai">Dubai</option>
                                            <option value="Singapore">Singapore</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="Age"><i class="fa-solid fa-calendar"></i>Age</label>
                                        <input type="number"
                                            class="form-control"
                                            id="Age"
                                            min="1"
                                            placeholder="Enter age">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label><i class="fa-solid fa-wallet"></i>Payment Option</label>
                                <div class="options-container">
                                    <label for="upi">
                                        <input type="radio"
                                            name="payment"
                                            id="upi"
                                            value="UPI">
                                        <i class="fa-brands fa-amazon-pay"></i>
                                        UPI
                                    </label>

                                    <label for="Netbanking">
                                        <input type="radio"
                                            name="payment"
                                            id="Netbanking"
                                            value="Netbanking">
                                        <i class="fa-solid fa-building-columns"></i>
                                        Netbanking
                                    </label>

                                    <label for="Cash">
                                        <input type="radio"
                                            name="payment"
                                            id="Cash"
                                            value="Cash">
                                        <i class="fa-solid fa-sack-dollar"></i>
                                        Cash
                                    </label>

                                    <label for="Card">
                                        <input type="radio"
                                            name="payment"
                                            id="Card"
                                            value="Card">
                                        <i class="fa-regular fa-credit-card"></i>
                                        Card
                                    </label>

                                </div>
                            </div>

                            <button type="submit"
                                class="btn btn-dark btn-block"
                                id="SubmitBtn">
                                <i class="fa-solid fa-plane"></i>
                                Submit
                            </button>

                            <button type="button"
                                class="btn btn-primary btn-block d-none"
                                id="UpdateBtn">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Update
                            </button>

                        </form>

                    </div>
                </div>
            </div>
            <div class="col-lg-12 col-md-7">

                <h3 class="passenger-heading">
                    <i class="fa-solid fa-ticket"></i>
                    Passenger Details
                </h3>
                <div class="table-responsive">
                    <table class="table table-bordered text-center">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Journey Type</th>
                                <th>Count</th>
                                <th>From</th>
                                <th>To</th>
                                <th>Age</th>
                                <th>Payment By</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody id="passangersdata">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
